<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Formulario de Registro</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="contenedor-formulario">
    <h1>Datos de contacto</h1>
    <p class="subtitulo">Todos los campos marcados con <span class="obligatorio">*</span> son obligatorios.</p>

    <form id="formularioContacto" novalidate>
      <div class="campo">
        <label for="nombre">Nombre completo <span class="obligatorio">*</span></label>
        <input
          type="text"
          id="nombre"
          name="nombre"
          placeholder="Ej. Carlos Mendoza"
          autocomplete="name"
          minlength="3"
          maxlength="60"
          required
        >
        <span class="mensaje-error" id="error-nombre" aria-live="polite"></span>
      </div>

      <div class="campo">
        <label for="correo">Correo electrónico <span class="obligatorio">*</span></label>
        <input
          type="email"
          id="correo"
          name="correo"
          placeholder="Ej. carlos@dominio.com"
          autocomplete="email"
          required
        >
        <span class="mensaje-error" id="error-correo" aria-live="polite"></span>
      </div>

      <div class="campo">
        <label for="telefono">Teléfono <span class="obligatorio">*</span></label>
        <input
          type="tel"
          id="telefono"
          name="telefono"
          placeholder="Ej. 300 123 4567"
          autocomplete="tel"
          inputmode="tel"
          maxlength="15"
          required
        >
        <span class="mensaje-error" id="error-telefono" aria-live="polite"></span>
      </div>

      <button type="submit">Guardar datos</button>

      <div id="mensajeEstado" class="mensaje-estado" role="alert" aria-live="polite"></div>
    </form>
  </main>

  <script src="script.js"></script>
</body>
</html>
